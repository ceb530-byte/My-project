services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plotpulse
      POSTGRES_PASSWORD: plotpulse
      POSTGRES_DB: plotpulse
    ports:
      - "5432:5432"
    volumes:
      - plotpulse_pg:/var/lib/postgresql/data

volumes:
  plotpulse_pg:
